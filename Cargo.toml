[workspace]
resolver = "3"
members = ["crates/gitpixel-core", "crates/gitpixel-cli", "crates/gitpixel-graph", "crates/gitpixel-context", "crates/gitpixel-serve", "crates/gitpixel-recall", "crates/gitpixel-bench", "crates/gitpixel-sniper"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LivioGama/gitpixel"

[workspace.dependencies]
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
proptest = "1.6"
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
