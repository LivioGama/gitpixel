[package]
name = "gitpixel-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "gitpixel"
path = "src/main.rs"

[features]
default = ["fastembed"]
fastembed = ["gitpixel-recall/fastembed"]

[dependencies]
gitpixel-core = { path = "../gitpixel-core" }
gitpixel-graph = { path = "../gitpixel-graph" }
gitpixel-recall = { path = "../gitpixel-recall" }
gitpixel-serve = { path = "../gitpixel-serve" }
gitpixel-sniper = { path = "../gitpixel-sniper" }
clap = { version = "4.5", features = ["derive"] }
serde = "1"
serde_json = "1"
regex = "1.13"
